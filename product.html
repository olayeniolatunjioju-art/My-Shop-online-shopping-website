<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY SHOP | Product Details</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            <span>MY</span> SHOP
        </div>

        <nav class="nav">

            <a href="index.html">HOME</a>

            <a href="index.html#collection">COLLECTION</a>

            <a href="cart.html" class="cart-link">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-count" class="cart-count">0</span>
            </a>

            <button type="button"
                class="logout-btn"
                onclick="logout()">
                LOGOUT
            </button>

        </nav>

    </header>


    <!-- ================= PRODUCT DETAILS ================= -->

    <main class="product-details-page">

        <div class="product-details">

            <!-- PRODUCT IMAGE -->

            <div class="product-details-image">

                <img
                    id="productImage"
                    src="./images/images.jpg"
                    alt="Product">

            </div>


            <!-- PRODUCT INFORMATION -->

            <div class="product-details-info">

                <p id="productCategory"
                    class="product-category">
                    FOOTWEAR
                </p>

                <h1 id="productName">
                    Classic Shoe
                </h1>

                <p id="productPrice"
                    class="product-details-price">
                    ₦20
                </p>

                <p id="productDescription"
                    class="product-description">
                    A stylish and comfortable shoe designed
                    to give your everyday outfit a clean and
                    confident finish.
                </p>


                <!-- SIZE -->

                <div id="sizeSection"
                    class="size-section">

                    <h3>
                        SELECT SIZE
                    </h3>

                    <div id="sizeOptions"
                        class="size-options">
                    </div>

                </div>


                <!-- QUANTITY -->

                <div class="details-quantity">

                    <h3>
                        QUANTITY
                    </h3>

                    <div class="quantity-control">

                        <button
                            type="button"
                            onclick="decreaseQuantity()">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <span id="quantity">
                            1
                        </span>

                        <button
                            type="button"
                            onclick="increaseQuantity()">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                    </div>

                </div>


                <!-- ADD TO CART -->

                <button
                    type="button"
                    class="details-add-cart"
                    onclick="addProductToCart()">

                    <i class="fa-solid fa-bag-shopping"></i>

                    ADD TO CART

                </button>

            </div>

        </div>

    </main>


    <!-- ================= FIREBASE ================= -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="auth.js"></script>

    <script src="script.js"></script>


    <!-- ================= PRODUCT SCRIPT ================= -->

    <script>

        const productData = {

            shoe: {

                name: "Classic Shoe",

                category: "FOOTWEAR",

                price: 20,

                image: "./images/images.jpg",

                description:
                    "A stylish and comfortable shoe designed to give your everyday outfit a clean and confident finish.",

                sizes: [
                    "39",
                    "40",
                    "41",
                    "42",
                    "43",
                    "44"
                ]

            },


            cap: {

                name: "Premium Cap",

                category: "ACCESSORIES",

                price: 10,

                image: "./images/cap2.jpg",

                description:
                    "A premium cap with a stylish design, perfect for adding a fashionable finishing touch to your everyday look."

            },


            ankara: {

                name: "Luxury Ankara",

                category: "FASHION",

                price: 35,

                image: "./images/Ankara.jpg",

                description:
                    "A beautiful Ankara fabric selected for its bold style, elegant appearance and timeless fashion appeal.",

                sizes: [
                    "XS",
                    "S",
                    "M",
                    "L",
                    "XL",
                    "XXL"
                ]

            }

        };


        /* ================= GET PRODUCT ================= */

        const urlParams =
            new URLSearchParams(window.location.search);

        const productType =
            urlParams.get("product") || "shoe";

        const product =
            productData[productType] || productData.shoe;


        /* ================= DISPLAY PRODUCT ================= */

        document.getElementById("productImage").src =
            product.image;

        document.getElementById("productImage").alt =
            product.name;

        document.getElementById("productName").textContent =
            product.name;

        document.getElementById("productCategory").textContent =
            product.category;

        document.getElementById("productPrice").textContent =
            "₦" + product.price.toLocaleString();

        document.getElementById("productDescription").textContent =
            product.description;


        /* ================= SIZE ================= */

        const sizeSection =
            document.getElementById("sizeSection");

        const sizeOptions =
            document.getElementById("sizeOptions");


        if (product.sizes) {

            sizeOptions.innerHTML = "";

            product.sizes.forEach(function (size, index) {

                const button =
                    document.createElement("button");

                button.type = "button";

                button.className = "size-button";

                button.textContent = size;

                button.onclick = function () {

                    document
                        .querySelectorAll(".size-button")
                        .forEach(function (btn) {

                            btn.classList.remove("active");

                        });

                    button.classList.add("active");

                    selectedSize = size;

                };

                sizeOptions.appendChild(button);

            });

        } else {

            sizeSection.style.display = "none";

        }


        /* ================= QUANTITY ================= */

        let currentQuantity = 1;

        let selectedSize = null;


        function increaseQuantity() {

            currentQuantity++;

            document.getElementById("quantity")
                .textContent = currentQuantity;

        }


        function decreaseQuantity() {

            if (currentQuantity > 1) {

                currentQuantity--;

                document.getElementById("quantity")
                    .textContent = currentQuantity;

            }

        }


        /* ================= ADD TO CART ================= */

        function addProductToCart() {

            if (
                product.sizes &&
                !selectedSize
            ) {

                alert("Please select a size.");

                return;

            }


            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            const existingItem =
                cart.find(function (item) {

                    return (
                        item.name === product.name &&
                        item.size === selectedSize
                    );

                });


            if (existingItem) {

                existingItem.quantity +=
                    currentQuantity;

            } else {

                cart.push({

                    name: product.name,

                    price: product.price,

                    image: product.image,

                    size: selectedSize,

                    quantity: currentQuantity

                });

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            if (typeof updateCartCount === "function") {

                updateCartCount();

            }


            alert(
                product.name +
                " added to your cart."
            );

        }

    </script>

</body>

</html>
