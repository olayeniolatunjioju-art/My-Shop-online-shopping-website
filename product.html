<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY SHOP | Product Details</title>


    <!-- MAIN CSS -->

    <link rel="stylesheet" href="style.css">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="logo">

            MY <span>SHOP</span>

        </div>


        <nav class="nav">

            <a href="index.html">
                HOME
            </a>

            <a href="index.html#collection">
                COLLECTION
            </a>

            <a href="index.html#about">
                ABOUT
            </a>

        </nav>


        <div class="header-actions">


            <!-- CART -->

            <a href="cart.html" class="cart-link">

                <i class="fa-solid fa-bag-shopping"></i>

                <span
                    id="cart-count"
                    class="cart-count"
                >
                    0
                </span>

            </a>


            <!-- LOGOUT -->

            <button
                type="button"
                class="logout-button"
                onclick="logout()"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                LOGOUT

            </button>

        </div>

    </header>



    <!-- =========================================
         PRODUCT DETAILS
    ========================================== -->

    <main class="product-details">


        <!-- PRODUCT IMAGE -->

        <div class="product-details-image">

            <img
                id="productImage"
                src="./images/images.jpg"
                alt="Product"
            >

        </div>



        <!-- PRODUCT INFORMATION -->

        <div class="product-details-info">


            <p
                id="productCategory"
                class="product-category"
            >
                FOOTWEAR
            </p>


            <h1 id="productName">
                Classic Shoe
            </h1>


            <div
                id="productPrice"
                class="product-details-price"
            >
                ₦20
            </div>


            <div class="product-details-line"></div>


            <p
                id="productDescription"
                class="product-description"
            >
                A stylish and comfortable shoe designed
                to give your everyday outfit a clean and
                confident finish.
            </p>



            <!-- =====================================
                 SIZE
            ====================================== -->

            <div
                id="sizeSection"
                class="size-section"
            >

                <p>
                    SIZE
                </p>


                <div
                    id="sizeOptions"
                    class="size-options"
                ></div>

            </div>



            <!-- =====================================
                 QUANTITY
            ====================================== -->

            <div class="details-quantity-section">

                <p>
                    QUANTITY
                </p>


                <div class="details-quantity">

                    <button
                        type="button"
                        onclick="decreaseQuantity()"
                    >

                        <i class="fa-solid fa-minus"></i>

                    </button>


                    <span id="quantity">
                        1
                    </span>


                    <button
                        type="button"
                        onclick="increaseQuantity()"
                    >

                        <i class="fa-solid fa-plus"></i>

                    </button>

                </div>

            </div>



            <!-- =====================================
                 ADD TO CART
            ====================================== -->

            <button
                type="button"
                class="details-add-cart"
                onclick="addProductToCart()"
            >

                <i class="fa-solid fa-bag-shopping"></i>

                ADD TO CART

            </button>


            <!-- MESSAGE -->

            <p
                id="cartMessage"
                class="cart-message"
            ></p>


        </div>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">

        <div class="footer-logo">

            MY <span>SHOP</span>

        </div>


        <p>
            Luxury style. Everyday confidence.
        </p>


        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#collection">
                Collection
            </a>

            <a href="cart.html">
                Cart
            </a>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 MY SHOP. All Rights Reserved.
            </p>

        </div>

    </footer>



    <!-- =========================================
         FIREBASE
    ========================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


    <!-- FIREBASE AUTH -->

    <script src="auth.js"></script>


    <!-- MAIN SCRIPT -->

    <script src="script.js"></script>



    <!-- =========================================
         PRODUCT JAVASCRIPT
    ========================================== -->

    <script>

        /* =========================================
           PRODUCT DATA
        ========================================= */

        const productData = {

            shoe: {

                name: "Classic Shoe",

                category: "FOOTWEAR",

                price: 20,

                image: "./images/images.jpg",

                description:
                    "A stylish and comfortable shoe designed to give your everyday outfit a clean and confident finish.",

                sizes: [
                    "39",
                    "40",
                    "41",
                    "42",
                    "43",
                    "44"
                ]

            },


            cap: {

                name: "Premium Cap",

                category: "ACCESSORIES",

                price: 10,

                image: "./images/cap2.jpg",

                description:
                    "A premium cap with a stylish design, perfect for adding a fashionable finishing touch to your everyday look."

            },


            ankara: {

                name: "Luxury Ankara",

                category: "FASHION",

                price: 35,

                image: "./images/ankara.jpg",

                description:
                    "A beautiful Ankara fabric selected for its bold style, elegant appearance and timeless fashion appeal.",

                sizes: [
                    "XS",
                    "S",
                    "M",
                    "L",
                    "XL",
                    "XXL"
                ]

            }

        };



        /* =========================================
           GET PRODUCT FROM URL
        ========================================== */

        const urlParams =
            new URLSearchParams(window.location.search);


        const productKey =
            urlParams.get("product") || "shoe";


        const product =
            productData[productKey] || productData.shoe;



        /* =========================================
           DISPLAY PRODUCT
        ========================================== */

        document.getElementById("productName")
            .textContent = product.name;


        document.getElementById("productCategory")
            .textContent = product.category;


        document.getElementById("productPrice")
            .textContent =
            "₦" + product.price.toLocaleString();


        document.getElementById("productDescription")
            .textContent = product.description;


        document.getElementById("productImage")
            .src = product.image;


        document.getElementById("productImage")
            .alt = product.name;



        /* =========================================
           SIZE SECTION
        ========================================== */

        const sizeSection =
            document.getElementById("sizeSection");


        const sizeOptions =
            document.getElementById("sizeOptions");


        let selectedSize = null;



        /*
        If the product has sizes,
        show the size section.

        If the product has NO sizes,
        hide the entire size section.
        */

        if (product.sizes && product.sizes.length > 0) {

            sizeSection.style.display = "block";


            product.sizes.forEach(function (size, index) {

                const button =
                    document.createElement("button");


                button.type = "button";

                button.className = "size-btn";

                button.textContent = size;


                button.addEventListener(
                    "click",
                    function () {

                        document
                            .querySelectorAll(".size-btn")
                            .forEach(function (btn) {

                                btn.classList.remove("selected");

                            });


                        button.classList.add("selected");


                        selectedSize = size;

                    }
                );


                sizeOptions.appendChild(button);


                /*
                Automatically select
                the first size.
                */

                if (index === 0) {

                    button.classList.add("selected");

                    selectedSize = size;

                }

            });

        } else {

            /*
            CAP HAS NO SIZE
            */

            sizeSection.style.display = "none";

            selectedSize = null;

        }



        /* =========================================
           QUANTITY
        ========================================== */

        let productQuantity = 1;


        function increaseQuantity() {

            productQuantity++;

            document.getElementById("quantity")
                .textContent = productQuantity;

        }


        function decreaseQuantity() {

            if (productQuantity > 1) {

                productQuantity--;

            }


            document.getElementById("quantity")
                .textContent = productQuantity;

        }



        /* =========================================
           ADD PRODUCT TO CART
        ========================================== */

        function addProductToCart() {

            /*
            Require size only when
            the product has sizes.
            */

            if (
                product.sizes &&
                product.sizes.length > 0 &&
                !selectedSize
            ) {

                showCartMessage(
                    "Please select a size.",
                    true
                );

                return;

            }


            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            /*
            Check if same product + same size
            already exists.
            */

            const existingItem =
                cart.find(function (item) {

                    return (
                        item.name === product.name &&
                        item.size === selectedSize
                    );

                });


            if (existingItem) {

                existingItem.quantity =
                    (Number(existingItem.quantity) || 1)
                    + productQuantity;

            } else {

                cart.push({

                    name: product.name,

                    price: product.price,

                    image: product.image,

                    size: selectedSize,

                    quantity: productQuantity

                });

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            /*
            Update cart badge
            */

            updateProductCartCount();


            /*
            Show success message
            */

            showCartMessage(
                "Added to cart successfully!",
                false
            );

        }



        /* =========================================
           UPDATE CART BADGE
        ========================================== */

        function updateProductCartCount() {

            const cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            let count = 0;


            cart.forEach(function (item) {

                count +=
                    Number(item.quantity) || 1;

            });


            const cartCount =
                document.getElementById("cart-count");


            if (cartCount) {

                cartCount.textContent = count;

            }

        }



        /* =========================================
           CART MESSAGE
        ========================================== */

        function showCartMessage(
            message,
            isError
        ) {

            const messageElement =
                document.getElementById("cartMessage");


            messageElement.textContent = message;


            if (isError) {

                messageElement.classList.add("error");

            } else {

                messageElement.classList.remove("error");

            }


            setTimeout(function () {

                messageElement.textContent = "";

            }, 2500);

        }



        /* =========================================
           INITIAL CART COUNT
        ========================================== */

        updateProductCartCount();

    </script>


</body>

</html>
